name: Smart Unzip Mindustry Mod

on:
  push:
    paths:
      - "*.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          mkdir -p temp
          for file in *.zip; do
            echo "Unzipping $file"
            unzip -o "$file" -d temp
          done

      - name: Smart flatten (remove mod/ folder)
        run: |
          shopt -s dotglob

          inner=$(find temp -mindepth 1 -maxdepth 1 -type d)

          count=$(echo "$inner" | wc -l)

          if [ "$count" -eq 1 ]; then
            echo "Single folder detected → flatten"
            cp -r $inner/* .
          else
            echo "Multiple items → direct copy"
            cp -r temp/* .
          fi

      - name: Cleanup
        run: rm -rf temp *.zip

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "auto-mod-unzip"
          git config user.email "bot@users.noreply.github.com"

          git add .
          git commit -m "Smart unzip mod" || echo "No changes"

          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main
